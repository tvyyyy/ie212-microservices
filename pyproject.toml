[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ie212"
version = "0.1.0"
description = "Reproducible Data Lakehouse pipeline for Alibaba microservice call-graph analysis, RPC latency forecasting, and processing engine benchmarks (IE212)."
readme = "README.md"
requires-python = ">=3.11,<3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
